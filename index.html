<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>读书笔记日历</title>
<style>
* {margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    padding: 10px;
    padding-bottom: 90px;
    color: #1f2937;
}
.header {
    text-align: center;
    color: white;
    padding: 15px 0;
}
.header h1 {
    font-size: 1.6rem;
    background: linear-gradient(to right, #fff, #e0e7ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.container {max-width: 1200px; margin: 0 auto;}

.card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
}
.card-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 15px;
    color: #4c1d95;
}

/* 上传区域 - 修复点击问题 */
.upload-area {
    border: 2px dashed #8b5cf6;
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    margin-bottom: 15px;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(139,92,246,0.05);
    position: relative;
    overflow: hidden;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}
.upload-area:active {
    background: rgba(139,92,246,0.15);
    transform: scale(0.98);
    border-color: #ec4899;
}
.upload-area.has-image {
    border-style: solid;
    border-color: #10b981;
    background: rgba(16,185,129,0.1);
}
.upload-icon {font-size: 3rem; margin-bottom: 10px; display: block;}
.upload-text {color: #6b7280; font-size: 1rem; font-weight: 500;}
.upload-hint {color: #9ca3af; font-size: 0.8rem; margin-top: 6px;}

/* 隐藏的file input */
#file-input {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    z-index: 10;
}

/* 预览图 */
.preview-container {
    margin-bottom: 15px;
    text-align: center;
    display: none;
    animation: fadeIn 0.3s;
}
.preview-container.show {display: block;}
.preview-img {
    max-width: 160px;
    max-height: 220px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    border: 3px solid white;
}
.remove-btn {
    margin-top: 10px;
    color: #ef4444;
    font-size: 0.9rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(239,68,68,0.1);
}

/* 书架 */
.book-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}
.add-btn {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 1.8rem;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(139,92,246,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: rgba(0,0,0,0.1);
}
.book-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(255,255,255,0.7);
    border-radius: 12px;
    margin-bottom: 10px;
    position: relative;
    touch-action: manipulation;
}
.book-cover {
    width: 50px;
    height: 68px;
    border-radius: 6px;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
}
.book-cover img {width: 100%; height: 100%; object-fit: cover;}
.book-info {flex: 1; min-width: 0;}
.book-name {font-weight: 600; font-size: 1rem; color: #4c1d95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.book-time {font-size: 0.8rem; color: #6b7280;}
.delete-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(239,68,68,0.1);
    color: #ef4444;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}
.delete-btn:active {
    background: #ef4444;
    color: white;
    transform: scale(0.9);
}

/* 日历 */
.cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}
.cal-header button {
    width: 36px;
    height: 36px;
    border: none;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    color: white;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    box-shadow: 0 4px 8px rgba(139,92,246,0.3);
}
.cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
}
.
