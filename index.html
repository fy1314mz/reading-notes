<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书笔记</title>
<style>
:root {
    --bg-primary: #FFF4E0;
    --bg-card: #FFFBF0;
    --text-primary: #5C4B37;
    --text-secondary: #8B7355;
    --border-color: #E8D5C4;
    --btn-primary: #E67E22;
    --btn-success: #30D158;
    --btn-danger: #E74C3C;
    --shadow: rgba(140, 110, 80, 0.15);
}
body.theme-dark {
    --bg-primary: #2A2B2E;
    --bg-card: #3A3B3F;
    --text-primary: #E8E8E8;
    --text-secondary: #A0A0A0;
    --border-color: #4A4B4F;
    --btn-primary: #5AC8FA;
    --btn-success: #30D158;
    --btn-danger: #FF453A;
    --shadow: rgba(0,0,0,0.4);
}
* {margin:0;padding:0;box-sizing:border-box; transition: all 0.3s;}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    min-height: 100vh;
    padding: 50px 10px 90px;
    color: var(--text-primary);
}
.card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 2px 10px var(--shadow);
    border: 1px solid var(--border-color);
}
h2 {margin: 0 0 15px 0; font-size: 1.1rem;}
.btn {
    background: var(--btn-primary);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
}
.btn:disabled {opacity: 0.5; cursor: not-allowed;}
.cal {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
    font-size: 0.8rem;
}
.cal .h {
    font-weight: 600;
    padding: 10px 0;
    background: rgba(0,0,0,0.05);
    border-radius: 8px;
    margin-bottom: 5px;
}
.cal .d {
    background: var(--bg-card);
    border-radius: 10px;
    cursor: pointer;
    min-height: 70px;
    padding: 6px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid var(--border-color);
}
.cal .d.today {background: var(--btn-primary); color: white;}
.cal .d.sel {background: var(--btn-success); color: white;}
.cal-date {font-weight: 700; font-size: 1rem; margin-bottom: 3px;}
.cal-books {width: 100%; margin-top: 2px;}
.cal-book-name {
    font-size: 0.6rem;
    background: rgba(0,0,0,0.08);
    padding: 2px 4px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 1px 0;
}
.theme-toggle {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 1000;
    display: flex;
    gap: 8px;
    background: var(--bg-card);
    padding: 6px;
    border-radius: 20px;
    box-shadow: 0 2px 8px var(--shadow);
}
.theme-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
}
.theme-btn.active {border-color: var(--btn-primary); transform: scale(1.1);}
.book-item, .note-item, .rank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: var(--bg-card);
    border-radius: 12px;
    margin-bottom: 10px;
    border: 1px solid var(--border-color);
}
.book-cover {
    width: 45px;
    height: 60px;
    border-radius: 6px;
    background: var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--btn-primary);
    overflow: hidden;
    flex-shrink: 0;
}
.book-cover img {width: 100%; height: 100%; object-fit: cover;}
.del {color: var(--btn-danger); background: none; border: none; font-size: 1.2rem; margin-left: auto; cursor: pointer;}
.nav {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 30px);
    max-width: 450px;
    height: 60px;
    background: var(--bg-card);
    border-radius: 30px;
    display: flex;
    box-shadow: 0 4px 20px var(--shadow);
}
.nav-item {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-size: 0.65rem;
    color: var(--text-secondary);
    cursor: pointer;
}
.nav-item.active {color: var(--btn-primary); background: rgba(0,0,0,0.05); border-radius: 25px; margin: 5px;}
body.theme-dark .nav-item.active {background: rgba(255,255,255,0.1);}
.nav-icon {font-size: 1.3rem; margin-bottom: 2px;}
.hide {display: none !important;}
.modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}
.modal.show {display: flex;}
.modal-box {
    background: var(--bg-card);
    padding: 20px;
    border-radius: 16px;
    width: 100%;
    max-width: 350px;
    border: 1px solid var(--border-color);
}
.upload {
    border: 2px dashed var(--border-color);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    margin-bottom: 15px;
    cursor: pointer;
}
.empty {color: var(--text-secondary); text-align: center; padding: 30px;}
input, select, textarea {
    width: 100%; padding: 12px; margin: 8px 0;
    border: 1px solid var(--border-color); border-radius: 10px;
    background: var(--bg-card); color: var(--text-primary); font-size: 1rem;
}
textarea {height: 80px; resize: none;}
.timer-box {text-align: center; padding: 20px; background: var(--bg-card); border-radius: 12px; margin: 10px 0;}
.timer-num {font-size: 2.2rem; font-family: monospace; font-weight: 700; margin: 15px 0; color: var(--text-primary);}
.rank-num {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem; margin-right: 12px;
    background: var(--border-color);
}
.rank-item:nth-child(1) .rank-num {background: #FFD700; color: #333;}
.rank-item:nth-child(2) .rank-num {background: #C0C0C0; color: #333;}
.rank-item:nth-child(3) .rank-num {background: #CD7F32; color: white;}
.guide-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 9998; display: none;
}
.guide-overlay.show {display: block;}
.guide-bubble {
    position: fixed; background: var(--bg-card);
    border: 2px solid var(--btn-primary); border-radius: 16px;
    padding: 20px; max-width: 280px; z-index: 9999; display: none;
}
.guide-bubble.show {display: block;}
</style>
</head>
<body>

<div class="theme-toggle">
<button class="theme-btn active" onclick="setTheme('')" style="background: #FFF4E0;">🌅</button>
<button class="theme-btn" onclick="setTheme('dark')" style="background: #2A2B2E; color: white;">🌙</button>
</div>

<div class="guide-overlay" id="guide-overlay"></div>
<div class="guide-bubble" id="guide-1" style="top: 130px; right: 20px;">
<div style="font-weight: bold; margin-bottom: 10px;">欢迎使用！</div>
<div style="font-size: 0.9rem; margin-bottom: 15px;">点击右上角「+」添加第一本书</div>
<button class="btn" onclick="nextGuide(2)" style="width: 100%;">我知道了</button>
</div>
<div class="guide-bubble" id="guide-2" style="top: 40%; left: 50%; transform: translateX(-50%);">
<div style="font-weight: bold; margin-bottom: 10px;">上传封面</div>
<div style="font-size: 0.9rem; margin-bottom: 15px;">点击相机图标选择照片</div>
<button class="btn" onclick="nextGuide(3)" style="width: 100%;">下一步</button>
</div>
<div class="guide-bubble" id="guide-3" style="bottom: 120px; left: 50%; transform: translateX(-50%);">
<div style="font-weight: bold; margin-bottom: 10px;">记录感悟</div>
<div style="font-size: 0.9rem; margin-bottom: 15px;">选择书籍，写下心得</div>
<button class="btn" onclick="finishGuide()" style="width: 100%;">开始体验</button>
</div>

<div id="views">
<!-- 日历 -->
<div class="card" id="view-cal">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
<h2 style="margin:0;">📅 <span id="ym"></span></h2>
<div style="display:flex; gap:8px;">
<button class="btn" onclick="pm()" style="padding:8px 14px;">‹</button>
<button class="btn" onclick="nm()" style="padding:8px 14px;">›</button>
</div>
</div>
<div class="cal" id="cal"></div>
</div>

<!-- 书架 -->
<div class="card hide" id="view-book">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
<h2 style="margin:0;">📖 书架</h2>
<button class="btn" id="add-book-btn" onclick="showAdd()" style="font-size:0.85rem;">+ 添加</button>
</div>
<div id="blist"></div>
</div>

<!-- 笔记 -->
<div class="card hide" id="view-note">
<h2>📝 笔记</h2>
<select id="sb"><option value="">选择书籍</option></select>
<textarea id="nt" placeholder="今天读了什么？"></textarea>
<button class="btn" id="save-note-btn" onclick="saven()" style="width:100%">保存</button>
<div id="nlist" style="margin-top:15px;"></div>
</div>

<!-- 计时器 -->
<div class="card hide" id="view-timer">
<h2>⏱️ 计时器</h2>
<select id="tb" style="margin-bottom:15px;"><option value="">选择书籍</option></select>
<div class="timer-box">
<div style="color: var(--text-secondary); font-size: 0.9rem;">本次阅读时长</div>
<div class="timer-num" id="tdisp">00:00:00</div>
<div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
<button class="btn" id="btn-start" onclick="tstart()" style="flex:1; background:var(--btn-success);">开始</button>
<button class="btn" id="btn-pause" onclick="tpause()" style="flex:1; display:none; background:#F39C12;">暂停</button>
<button class="btn" id="btn-stop" onclick="tstop()" style="flex:1; background:var(--btn-danger);">结束</button>
</div>
</div>
<div style="margin-top:20px;">
<h3 style="font-size:1rem; margin-bottom:10px;">📊 本月阅读排行榜</h3>
<div id="ranklist" style="min-height:100px;"></div>
</div>
</div>
</div>

<div class="nav">
<div class="nav-item active" onclick="switchv('cal',this)"><div class="nav-icon">📅</div><div>日历</div></div>
<div class="nav-item" onclick="switchv('book',this)"><div class="nav-icon">📚</div><div>书架</div></div>
<div class="nav-item" onclick="switchv('note',this)"><div class="nav-icon">📝</div><div>笔记</div></div>
<div class="nav-item" onclick="switchv('timer',this)"><div class="nav-icon">⏱️</div><div>计时</div></div>
</div>

<div class="modal" id="addm">
<div class="modal-box">
<h3 style="margin-bottom:15px;">添加书籍</h3>
<div class="upload" onclick="document.getElementById('fin').click()" style="margin-bottom:15px;">
<div style="font-size:2rem;">📷</div>
<div style="font-size:0.9rem; color:var(--text-secondary);">点击上传封面（可选）</div>
</div>
<input type="file" id="fin" accept="image/*" style="display:none" onchange="handlef(this)">
<div id="preview" style="display:none; margin-bottom:15px; text-align:center;">
<img id="pimg" style="max-width:100px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
<div style="color:var(--btn-danger); margin-top:8px; cursor:pointer; font-size:0.85rem;" onclick="clrimg()">🗑️ 移除图片</div>
</div>
<input type="text" id="bn" placeholder="书名（必填）" style="margin-bottom:12px;">
<button class="btn" onclick="addb()" style="width:100%;">确认添加</button>
<button onclick="document.getElementById('addm').classList.remove('show')" style="width:100%; margin-top:10px; padding:10px; border:none; background:var(--border-color); border-radius:8px; color:var(--text-secondary);">取消</button>
</div>
</div>

<script>
// 数据初始化
let data = {books:[], covers:{}, notes:[], time:{}};
let cur = new Date();
let sel = new Date();
let tmpimg = null;
let tmr = null;
let tsec = 0;
let isRunning = false;

// 从存储加载
try {
    let d = localStorage.getItem('rd6');
    if(d) data = JSON.parse(d);
} catch(e) {}

// 保存函数
function saveData() {
    try {
        localStorage.setItem('rd6', JSON.stringify(data));
        console.log('数据已保存:', data.time);
    } catch(e) {
        alert('存储空间不足，无法保存');
    }
}

// 主题设置
function setTheme(t) {
    if(t === 'dark') {
        document.body.classList.add('theme-dark');
        localStorage.setItem('theme', 'dark');
        document.querySelectorAll('.theme-btn')[0].classList.remove('active');
        document.querySelectorAll('.theme-btn')[1].classList.add('active');
    } else {
        document.body.classList.remove('theme-dark');
        localStorage.setItem('theme', '');
        document.querySelectorAll('.theme-btn')[0].classList.add('active');
        document.querySelectorAll('.theme-btn')[1].classList.remove('active');
    }
}

// 加载主题
try {
    let t = localStorage.getItem('theme');
    if(t === 'dark') setTheme('dark');
} catch(e) {}

// 日历渲染
function rd() {
    let y = cur.getFullYear(), m = cur.getMonth();
    document.getElementById('ym').textContent = y + '年' + (m + 1) + '月';
    let g = document.getElementById('cal');
    let html = '<div class="h">日</div><div class="h">一</div><div class="h">二</div><div class="h">三</div><div class="h">四</div><div class="h">五</div><div class="h">六</div>';
    
    let firstDay = new Date(y, m, 1).getDay();
    for(let i = 0; i < firstDay; i++) html += '<div></div>';
    
    let daysInMonth = new Date(y, m + 1, 0).getDate();
    let today = new Date();
    
    for(let d = 1; d <= daysInMonth; d++) {
        let ds = y + '-' + (m + 1) + '-' + d;
        let dayNotes = data.notes.filter(n => n.date == ds);
        let books = [...new Set(dayNotes.map(n => n.book))];
        let cls = 'd';
        if(y == today.getFullYear() && m == today.getMonth() && d == today.getDate()) cls += ' today';
        if(y == sel.getFullYear() && m == sel.getMonth() && d == sel.getDate()) cls += ' sel';
        
        let booksHtml = '';
        if(books.length > 0) {
            booksHtml = '<div class="cal-books">' + 
                books.slice(0, 2).map(b => '<div class="cal-book-name">' + (b.length > 3 ? b.substring(0, 3) + '..' : b) + '</div>').join('') +
                (books.length > 2 ? '<div class="cal-book-name">+' + (books.length - 2) + '</div>' : '') +
                '</div>';
        }
        html += '<div class="' + cls + '" onclick="sd(' + y + ',' + m + ',' + d + ')"><div class="cal-date">' + d + '</div>' + booksHtml + '</div>';
    }
    
    // 补齐格子
    let total = firstDay + daysInMonth;
    let rem = 7 - (total % 7);
    if(rem < 7) {
        for(let i = 0; i < rem; i++) html += '<div></div>';
    }
    g.innerHTML = html;
}

function pm() { cur.setMonth(cur.getMonth() - 1); rd(); }
function nm() { cur.setMonth(cur.getMonth() + 1); rd(); }
function sd(y, m, d) {
    sel = new Date(y, m, d);
    rd();
    if(window.innerWidth < 768) switchv('note', document.querySelectorAll('.nav-item')[2]);
    rn();
}

// 书架
function rb() {
    let b = document.getElementById('blist');
    if(data.books.length == 0) {
        b.innerHTML = '<div class="empty">暂无书籍，点击右上角添加</div>';
    } else {
        b.innerHTML = data.books.map((x, i) => {
            let c = data.covers[x];
            return '<div class="book-item" onclick="sb(\'' + x.replace(/'/g, "\\'") + '\')">' +
                '<div class="book-cover">' + (c ? '<img src="' + c + '">' : x[0]) + '</div>' +
                '<div style="flex:1;"><div style="font-weight:600;">' + x + '</div></div>' +
                '<button class="del" onclick="db(event, ' + i + ')">🗑️</button>' +
                '</div>';
        }).join('');
    }
    // 更新下拉框
    let opts = data.books.map(x => '<option value="' + x.replace(/"/g, '&quot;') + '">' + x + '</option>').join('');
    document.getElementById('sb').innerHTML = '<option value="">选择书籍</option>' + opts;
    document.getElementById('tb').innerHTML = '<option value="">选择书籍</option>' + opts;
}

function showAdd() {
    tmpimg = null;
    document.getElementById('bn').value = '';
    document.getElementById('preview').style.display = 'none';
    document.getElementById('addm').classList.add('show');
}

function handlef(input) {
    let f = input.files[0];
    if(!f) return;
    let r = new FileReader();
    r.onload = function(e) {
        tmpimg = e.target.result;
        document.getElementById('pimg').src = tmpimg;
        document.getElementById('preview').style.display = 'block';
    };
    r.readAsDataURL(f);
}

function clrimg() {
    tmpimg = null;
    document.getElementById('preview').style.display = 'none';
    document.getElementById('fin').value = '';
}

function addb() {
    let n = document.getElementById('bn').value.trim();
    if(!n) { alert('请输入书名'); return; }
    if(data.books.includes(n)) { alert('该书已存在'); return; }
    data.books.push(n);
    if(tmpimg) data.covers[n] = tmpimg;
    saveData();
    rb();
    rd();
    document.getElementById('addm').classList.remove('show');
    if(guideStep == 2) nextGuide(3);
}

function db(e, i) {
    e.stopPropagation();
    if(!confirm('确定删除《' + data.books[i] + '》？')) return;
    data.books.splice(i, 1);
    saveData();
    rb();
    rd();
}

function sb(x) {
    document.getElementById('sb').value = x;
    switchv('note', document.querySelectorAll('.nav-item')[2]);
}

// 笔记
function rn() {
    let ds = sel.getFullYear() + '-' + (sel.getMonth() + 1) + '-' + sel.getDate();
    let n = data.notes.filter(x => x.date == ds).reverse();
    if(n.length == 0) {
        document.getElementById('nlist').innerHTML = '<div class="empty">' + ds + '<br>暂无笔记</div>';
    } else {
        document.getElementById('nlist').innerHTML = n.map((x, i) => 
            '<div class="note-item" style="position:relative; padding-right:40px;">' +
            '<button onclick="dn(' + i + ')" style="position:absolute; top:8px; right:8px; background:var(--btn-danger); color:white; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer;">×</button>' +
            '<div style="color:var(--btn-primary); font-weight:600; margin-bottom:4px;">' + x.book + '</div>' +
            '<div style="line-height:1.5;">' + x.content + '</div>' +
            '</div>'
        ).join('');
    }
}

function saven() {
    let b = document.getElementById('sb').value;
    let t = document.getElementById('nt').value.trim();
    if(!b || !t) { alert('请填写完整'); return; }
    data.notes.push({
        date: sel.getFullYear() + '-' + (sel.getMonth() + 1) + '-' + sel.getDate(),
        book: b,
        content: t
    });
    document.getElementById('nt').value = '';
    saveData();
    rn();
    rd();
    if(guideStep == 3) finishGuide();
}

function dn(idx) {
    let ds = sel.getFullYear() + '-' + (sel.getMonth() + 1) + '-' + sel.getDate();
    let notes = data.notes.filter(x => x.date == ds).reverse();
    if(confirm('删除这条笔记？')) {
        let realIdx = data.notes.indexOf(notes[idx]);
        if(realIdx > -1) {
            data.notes.splice(realIdx, 1);
            saveData();
            rn();
            rd();
        }
    }
}

// 计时器 - 修复版
function tstart() {
    let b = document.getElementById('tb').value;
    if(!b) {
        alert('请先选择要阅读的书籍！');
        return;
    }
    if(isRunning) return; // 防止重复开始
    
    isRunning = true;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-pause').style.display = 'block';
    document.getElementById('btn-pause').textContent = '暂停';
    
    tmr = setInterval(() => {
        tsec++;
        let h = Math.floor(tsec / 3600);
        let m = Math.floor((tsec % 3600) / 60);
        let s = tsec % 60;
        document.getElementById('tdisp').textContent = 
            [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }, 1000);
}

function tpause() {
    if(!isRunning) return;
    
    clearInterval(tmr);
    isRunning = false;
    document.getElementById('btn-start').style.display = 'block';
    document.getElementById('btn-pause').style.display = 'none';
    document.getElementById('btn-start').textContent = '继续';
}

function tstop() {
    clearInterval(tmr);
    
    let b = document.getElementById('tb').value;
    console.log('停止计时，书籍:', b, '时间(秒):', tsec); // 调试信息
    
    if(b && tsec > 0) {
        // 保存时间（转换为分钟存储，或保持秒）
        if(!data.time[b]) data.time[b] = 0;
        data.time[b] += tsec;
        
        console.log('保存后的时间:', data.time); // 调试
        
        saveData();
        
        // 显示保存成功提示
        let minutes = Math.floor(tsec / 60);
        alert('已记录《' + b + '》阅读时长：' + (minutes > 0 ? minutes + '分钟' : tsec + '秒'));
        
        // 刷新排行榜
        rr();
    } else if(!b) {
        alert('请先选择书籍！');
    }
    
    // 重置状态
    tsec = 0;
    isRunning = false;
    document.getElementById('tdisp').textContent = '00:00:00';
    document.getElementById('btn-start').style.display = 'block';
    document.getElementById('btn-start').textContent = '开始';
    document.getElementById('btn-pause').style.display = 'none';
}

// 排行榜渲染
function rr() {
    console.log('刷新排行榜, data.time:', data.time); // 调试
    let ranked = data.books.map(b => ({
        book: b,
        time: data.time[b] || 0
    })).filter(x => x.time > 0).sort((a, b) => b.time - a.time);
    
    console.log('排序后:', ranked); // 调试
    
    if(ranked.length === 0) {
        document.getElementById('ranklist').innerHTML = '<div class="empty">暂无阅读记录<br>点击"开始"按钮开始计时</div>';
    } else {
        document.getElementById('ranklist').innerHTML = ranked.map((x, i) => {
            let h = Math.floor(x.time / 3600);
            let m = Math.floor((x.time % 3600) / 60);
            let timeStr = h > 0 ? h + '小时' + m + '分' : (m > 0 ? m + '分钟' : x.time + '秒');
            return '<div class="rank-item">' +
                '<div class="rank-num">' + (i + 1) + '</div>' +
                '<div style="flex:1;">' +
                '<div style="font-weight:600;">' + x.book + '</div>' +
                '<div style="font-size:0.85rem; color:var(--text-secondary);">' + timeStr + '</div>' +
                '</div>' +
                '</div>';
        }).join('');
    }
}

// 页面切换
function switchv(v, e) {
    ['cal', 'book', 'note', 'timer'].forEach(x => document.getElementById('view-' + x).classList.add('hide'));
    document.getElementById('view-' + v).classList.remove('hide');
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    if(e) e.classList.add('active');
    
    if(v === 'book') rb();
    if(v === 'note') rn();
    if(v === 'timer') {
        rb();
        rr(); // 确保切换到计时页面时刷新排行榜
    }
}

// 新手引导
let guideStep = 0;
function checkGuide() {
    if(!localStorage.getItem('guided_v2') && data.books.length === 0) {
        setTimeout(() => {
            guideStep = 1;
            document.getElementById('guide-overlay').classList.add('show');
            document.getElementById('guide-1').classList.add('show');
            document.getElementById('add-book-btn').style.boxShadow = '0 0 0 4px var(--btn-primary)';
        }, 500);
    }
}
function nextGuide(s) {
    document.getElementById('guide-' + guideStep).classList.remove('show');
    document.getElementById('guide-' + guideStep).style.display = 'none';
    guideStep = s;
    if(s == 2) {
        document.getElementById('add-book-btn').style.boxShadow = '';
        showAdd();
        setTimeout(() => {
            document.getElementById('guide-2').classList.add('show');
            document.getElementById('guide-2').style.display = 'block';
        }, 100);
    } else if(s == 3) {
        document.getElementById('guide-2').classList.remove('show');
        document.getElementById('guide-2').style.display = 'none';
        document.getElementById('addm').classList.remove('show');
        switchv('note', document.querySelectorAll('.nav-item')[2]);
        setTimeout(() => {
            document.getElementById('guide-3').classList.add('show');
            document.getElementById('guide-3').style.display = 'block';
            document.getElementById('save-note-btn').style.boxShadow = '0 0 0 4px var(--btn-primary)';
        }, 300);
    }
}
function finishGuide() {
    document.getElementById('guide-3').classList.remove('show');
    document.getElementById('guide-3').style.display = 'none';
    document.getElementById('guide-overlay').classList.remove('show');
    document.getElementById('save-note-btn').style.boxShadow = '';
    localStorage.setItem('guided_v2', 'true');
}

// 立即执行
rd();
rb();
checkGuide();
</script>
