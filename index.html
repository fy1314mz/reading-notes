<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 读书笔记日历</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6c5ce7;--secondary:#a29bfe;--accent:#fd79a8;--warm:#fdcb6e;--mint:#00cec9;--coral:#e17055;--sky:#74b9ff;--lavender:#dfe6e9;--dark:#2d3436;--light:#ffeaa7}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;color:var(--dark)}
.app-container{max-width:1200px;margin:0 auto}
.app-header{text-align:center;padding:24px 0;color:white}
.app-header h1{font-size:2.4rem;text-shadow:2px 2px 4px rgba(0,0,0,0.2);margin-bottom:6px}
.app-header p{font-size:1rem;opacity:0.9}
.main-layout{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
@media(max-width:900px){.main-layout{grid-template-columns:1fr}}
.card{background:white;border-radius:20px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.calendar-header h2{font-size:1.4rem;color:var(--primary)}
.calendar-nav{display:flex;gap:8px}
.calendar-nav button{width:36px;height:36px;border:none;border-radius:50%;background:var(--secondary);color:white;font-size:1.1rem;cursor:pointer;transition:all 0.2s}
.calendar-nav button:hover{background:var(--primary);transform:scale(1.1)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-name{text-align:center;font-weight:600;color:var(--primary);padding:8px 0;font-size:0.85rem}
.day-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;transition:all 0.2s;position:relative;font-size:0.9rem}
.day-cell:hover{background:var(--lavender);transform:scale(1.05)}
.day-cell.today{background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;font-weight:700}
.day-cell.selected{background:linear-gradient(135deg,var(--accent),var(--coral));color:white;font-weight:700;box-shadow:0 4px 15px rgba(253,121,168,0.4)}
.day-cell.has-notes::after{content:'';position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--mint)}
.day-cell.has-notes.today::after,.day-cell.has-notes.selected::after{background:var(--warm)}
.day-cell.other-month{opacity:0.3}
.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat-item{text-align:center;padding:14px 8px;border-radius:14px}
.stat-item:nth-child(1){background:linear-gradient(135deg,#ffeaa7,#fff)}
.stat-item:nth-child(2){background:linear-gradient(135deg,#dfe6e9,#fff)}
.stat-item:nth-child(3){background:linear-gradient(135deg,#ffecd2,#fff)}
.stat-number{font-size:1.5rem;font-weight:700;color:var(--primary)}
.stat-label{font-size:0.75rem;color:#636e72;margin-top:2px}
.right-panel{display:flex;flex-direction:column;gap:20px}
.timer-card{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:white}
.timer-card h3{margin-bottom:12px;font-size:1.1rem}
.timer-display{text-align:center;font-size:3rem;font-weight:700;font-family:'Courier New',monospace;margin:12px 0;text-shadow:2px 2px 4px rgba(0,0,0,0.2)}
.timer-book-select{width:100%;padding:10px 14px;border:2px solid rgba(255,255,255,0.3);border-radius:10px;background:rgba(255,255,255,0.15);color:white;font-size:0.9rem;margin-bottom:12px;outline:none}
.timer-book-select option{color:var(--dark);background:white}
.timer-controls{display:flex;gap:10px;justify-content:center}
.timer-controls button{padding:10px 24px;border:none;border-radius:25px;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-start{background:var(--mint);color:white}
.btn-pause{background:var(--warm);color:var(--dark)}
.btn-stop{background:var(--accent);color:white}
.timer-controls button:hover{transform:scale(1.05);box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.notes-card h3{color:var(--primary);margin-bottom:4px}
.notes-date{font-size:0.85rem;color:#636e72;margin-bottom:14px}
.book-input-group{display:flex;gap:8px;margin-bottom:12px}
.book-input-group input{flex:1;padding:10px 14px;border:2px solid var(--lavender);border-radius:10px;font-size:0.9rem;outline:none;transition:border-color 0.2s}
.book-input-group input:focus{border-color:var(--secondary)}
.book-input-group button{padding:10px 16px;border:none;border-radius:10px;background:var(--primary);color:white;font-size:0.9rem;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.book-input-group button:hover{background:var(--secondary)}
.note-textarea{width:100%;min-height:120px;padding:14px;border:2px solid var(--lavender);border-radius:12px;font-size:0.9rem;font-family:inherit;resize:vertical;outline:none;transition:border-color 0.2s}
.note-textarea:focus{border-color:var(--secondary)}
.save-note-btn{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--mint),#55efc4);color:white;font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px;transition:all 0.2s}
.save-note-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,206,201,0.4)}
.notes-list{margin-top:16px;max-height:300px;overflow-y:auto}
.note-item{padding:12px;border-radius:12px;margin-bottom:10px;border-left:4px solid;transition:all 0.2s}
.note-item:nth-child(5n+1){background:#fff3e0;border-color:var(--coral)}
.note-item:nth-child(5n+2){background:#e8f5e9;border-color:var(--mint)}
.note-item:nth-child(5n+3){background:#f3e5f5;border-color:var(--primary)}
.note-item:nth-child(5n+4){background:#e3f2fd;border-color:var(--sky)}
.note-item:nth-child(5n+5){background:#fff8e1;border-color:var(--warm)}
.note-item:hover{transform:translateX(4px)}
.note-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.note-item-book{font-weight:600;font-size:0.9rem}
.note-item-time{font-size:0.75rem;color:#636e72;background:rgba(0,0,0,0.05);padding:2px 8px;border-radius:10px}
.note-item-content{font-size:0.85rem;color:#555;line-height:1.5;white-space:pre-wrap}
.note-item-delete{background:none;border:none;color:#b2bec3;cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:4px;transition:all 0.2s}
.note-item-delete:hover{color:var(--accent);background:rgba(253,121,168,0.1)}
.book-list-card h3{color:var(--primary);margin-bottom:14px}
.book-list{max-height:200px;overflow-y:auto}
.book-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:6px;background:linear-gradient(135deg,#f8f9fa,#fff);transition:all 0.2s}
.book-item:hover{background:linear-gradient(135deg,var(--lavender),#fff);transform:translateX(3px)}
.book-item-name{font-weight:500;font-size:0.9rem}
.book-item-time{font-size:0.8rem;color:var(--primary);font-weight:600}
.empty-state{color:#b2bec3;text-align:center;padding:20px;font-size:0.9rem}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:3px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--dark);color:white;padding:12px 24px;border-radius:25px;font-size:0.9rem;opacity:0;transition:all 0.3s ease;z-index:1000}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="app-container">
<header class="app-header">
<h1>📚 读书笔记日历</h1>
<p>记录每一天的阅读时光</p>
</header>
<div class="main-layout">
<div>
<div class="card">
<div class="calendar-header">
<h2 id="calendarTitle"></h2>
<div class="calendar-nav">
<button onclick="changeMonth(-1)">‹</button>
<button onclick="changeMonth(1)">›</button>
</div>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
<div class="stats-bar">
<div class="stat-item"><div class="stat-number" id="statDays">0</div><div class="stat-label">本月阅读天数</div></div>
<div class="stat-item"><div class="stat-number" id="statBooks">0</div><div class="stat-label">在读书籍</div></div>
<div class="stat-item"><div class="stat-number" id="statTime">0h</div><div class="stat-label">本月阅读时长</div></div>
</div>
</div>
<div class="card" style="margin-top:20px">
<h3>📝 当日笔记</h3>
<p class="notes-date" id="selectedDateLabel">请选择日期</p>
<div class="notes-list" id="notesList"><p class="empty-state">这天还没有笔记 ✨</p></div>
</div>
</div>
<div class="right-panel">
<div class="card timer-card">
<h3>⏱️ 阅读计时器</h3>
<select class="timer-book-select" id="timerBookSelect"><option value="">选择正在读的书...</option></select>
<div class="timer-display" id="timerDisplay">00:00:00</div>
<div class="timer-controls">
<button class="btn-start" id="btnStart" onclick="startTimer()">开始</button>
<button class="btn-pause" id="btnPause" onclick="pauseTimer()" style="display:none">暂停</button>
<button class="btn-stop" id="btnStop" onclick="stopTimer()" style="display:none">结束</button>
</div>
</div>
<div class="card notes-card">
<h3>✍️ 添加笔记</h3>
<p class="notes-date" id="noteFormDate"></p>
<div class="book-input-group">
<input type="text" id="bookNameInput" placeholder="书名" list="bookSuggestions">
<datalist id="bookSuggestions"></datalist>
<button onclick="addBook()">+ 添加书</button>
</div>
<textarea class="note-textarea" id="noteContent" placeholder="写下你的读书感悟..."></textarea>
<button class="save-note-btn" onclick="saveNote()">💾 保存笔记</button>
</div>
<div class="card book-list-card">
<h3>📖 我的书架</h3>
<div class="book-list" id="bookList"><p class="empty-state">还没有添加书籍</p></div>
</div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
let currentDate=new Date();let selectedDate=new Date();let timerInterval=null;let timerSeconds=0;let timerRunning=false;
function getData(){return JSON.parse(localStorage.getItem('readingNotes')||'{"notes":[],"books":[],"readingTime":{}}')}
function saveDataStore(data){localStorage.setItem('readingNotes',JSON.stringify(data))}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function getDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function formatTime(seconds){if(!seconds)return'0分钟';const h=Math.floor(seconds/3600);const m=Math.floor((seconds%3600)/60);if(h>0)return h+'时'+m+'分';return m+'分钟'}
function formatTimerDisplay(seconds){const h=Math.floor(seconds/3600);const m=Math.floor((seconds%3600)/60);const s=seconds%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function renderCalendar(){const year=currentDate.getFullYear();const month=currentDate.getMonth();document.getElementById('calendarTitle').textContent=year+'年 '+(month+1)+'月';const grid=document.getElementById('calendarGrid');grid.innerHTML='';const dayNames=['日','一','二','三','四','五','六'];dayNames.forEach(n=>{const el=document.createElement('div');el.className='day-name';el.textContent=n;grid.appendChild(el)});const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();const prevDays=new Date(year,month,0).getDate();const today=new Date();const data=getData();for(let i=firstDay-1;i>=0;i--){const el=document.createElement('div');el.className='day-cell other-month';el.textContent=prevDays-i;grid.appendChild(el)}for(let day=1;day<=daysInMonth;day++){const el=document.createElement('div');el.className='day-cell';el.textContent=day;const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');if(today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===day)el.classList.add('today');if(selectedDate.getFullYear()===year&&selectedDate.getMonth()===month&&selectedDate.getDate()===day)el.classList.add('selected');if(data.notes.some(n=>n.date===dateStr))el.classList.add('has-notes');el.onclick=()=>selectDate(year,month,day);grid.appendChild(el)}const total=firstDay+daysInMonth;const rem=(7-total%7)%7;for(let i=1;i<=rem;i++){const el=document.createElement('div');el.className='day-cell other-month';el.textContent=i;grid.appendChild(el)}updateStats()}
function changeMonth(delta){currentDate.setMonth(currentDate.getMonth()+delta);renderCalendar()}
function selectDate(y,m,d){selectedDate=new Date(y,m,d);renderCalendar();renderNotes();updateNoteFormDate()}
function updateNoteFormDate(){const s=getDateStr(selectedDate);document.getElementById('noteFormDate').textContent=s;document.getElementById('selectedDateLabel').textContent=s}
function updateStats(){const data=getData();const year=currentDate.getFullYear();const month=currentDate.getMonth();const prefix=year+'-'+String(month+1).padStart(2,'0');const monthNotes=data.notes.filter(n=>n.date.startsWith(prefix));const uniqueDays=new Set(monthNotes.map(n=>n.date));document.getElementById('statDays').textContent=uniqueDays.size;document.getElementById('statBooks').textContent=data.books.length;const totalSec=Object.values(data.readingTime).reduce((a,b)=>a+b,0);const hours=Math.round(totalSec/3600*10)/10;document.getElementById('statTime').textContent=hours+'h'}
function renderNotes(){const data=getData();const dateStr=getDateStr(selectedDate);const dayNotes=data.notes.filter(n=>n.date===dateStr);const list=document.getElementById('notesList');if(dayNotes.length===0){list.innerHTML='<p class="empty-state">这天还没有笔记 ✨</p>';return}list.innerHTML=dayNotes.map((note,i)=>'<div class="note-item"><div class="note-item-header"><span class="note-item-book">📖 '+note.book+'</span><div>'+(note.readingTime?'<span class="note-item-time">⏱ '+formatTime(note.readingTime)+'</span>':'')+'<button class="note-item-delete" onclick="deleteNote(\''+dateStr+'\','+i+')">✕</button></div></div><div class="note-item-content">'+escapeHtml(note.content)+'</div></div>').join('')}
function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}
function saveNote(){const book=document.getElementById('bookNameInput').value.trim();const content=document.getElementById('noteContent').value.trim();if(!book){showToast('请输入书名');return}if(!content){showToast('请输入笔记内容');return}const data=getData();data.notes.push({date:getDateStr(selectedDate),book,content,readingTime:0,createdAt:new Date().toISOString()});if(!data.books.includes(book)){data.books.push(book);if(!data.readingTime[book])data.readingTime[book]=0}saveDataStore(data);document.getElementById('noteContent').value='';renderNotes();renderCalendar();renderBookList();updateBookSuggestions();updateTimerSelect();showToast('笔记已保存 ✨')}
function deleteNote(dateStr,idx){const data=getData();const dayNotes=data.notes.filter(n=>n.date===dateStr);const target=dayNotes[idx];const realIdx=data.notes.indexOf(target);if(realIdx>-1)data.notes.splice(realIdx,1);saveDataStore(data);renderNotes();renderCalendar();showToast('笔记已删除')}
function addBook(){const input=document.getElementById('bookNameInput');const book=input.value.trim();if(!book){showToast('请输入书名');return}const data=getData();if(data.books.includes(book)){showToast('这本书已在书架中');return}data.books.push(book);if(!data.readingTime[book])data.readingTime[book]=0;saveDataStore(data);renderBookList();updateBookSuggestions();updateTimerSelect();showToast('《'+book+'》已添加到书架')}
function renderBookList(){const data=getData();const list=document.getElementById('bookList');if(data.books.length===0){list.innerHTML='<p class="empty-state">还没有添加书籍</p>';return}list.innerHTML=data.books.map(book=>'<div class="book-item"><span class="book-item-name">📖 '+book+'</span><span class="book-item-time">'+formatTime(data.readingTime[book]||0)+'</span></div>').join('')}
function updateBookSuggestions(){const data=getData();document.getElementById('bookSuggestions').innerHTML=data.books.map(b=>'<option value="'+b+'">').join('')}
function updateTimerSelect(){const data=getData();const sel=document.getElementById('timerBookSelect');const cur=sel.value;sel.innerHTML='<option value="">选择正在读的书...</option>'+data.books.map(b=>'<option value="'+b+'">'+b+'</option>').join('');sel.value=cur}
function startTimer(){const book=document.getElementById('timerBookSelect').value;if(!book){showToast('请先选择一本书');return}timerRunning=true;document.getElementById('btnStart').style.display='none';document.getElementById('btnPause').style.display='inline-block';document.getElementById('btnStop').style.display='inline-block';timerInterval=setInterval(()=>{timerSeconds++;document.getElementById('timerDisplay').textContent=formatTimerDisplay(timerSeconds)},1000)}
function pauseTimer(){if(timerRunning){clearInterval(timerInterval);timerRunning=false;document.getElementById('btnPause').textContent='继续'}else{timerRunning=true;timerInterval=setInterval(()=>{timerSeconds++;document.getElementById('timerDisplay').textContent=formatTimerDisplay(timerSeconds)},1000);document.getElementById('btnPause').textContent='暂停'}}
function stopTimer(){clearInterval(timerInterval);timerRunning=false;const book=document.getElementById('timerBookSelect').value;if(book&&timerSeconds>0){const data=getData();if(!data.readingTime[book])data.readingTime[book]=0;data.readingTime[book]+=timerSeconds;saveDataStore(data);renderBookList();updateStats();showToast('《'+book+'》本次阅读 '+formatTime(timerSeconds))}timerSeconds=0;document.getElementById('timerDisplay').textContent='00:00:00';document.getElementById('btnStart').style.display='inline-block';document.getElementById('btnPause').style.display='none';document.getElementById('btnStop').style.display='none';document.getElementById('btnPause').textContent='暂停'}
renderCalendar();updateNoteFormDate();renderNotes();renderBookList();updateBookSuggestions();updateTimerSelect();
</script>
</body>
</html>
